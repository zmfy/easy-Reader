services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 默认官方源；国内网络可在 .env 里改用国内源（见 .env.example）
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    container_name: novel-reader
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - ./books:/app/books
      - ./data:/app/data
    # 让容器内可访问宿主机上的 Ollama（baseUrl 填 http://host.docker.internal:11434）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - BOOKS_DIR=/app/books
      - DATA_DIR=/app/data
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - USAGE_STATS=${USAGE_STATS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
