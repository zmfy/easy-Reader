version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-reader-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./books:/app/books               # 测试用本地目录
      - ./data:/app/data                 # SQLite 数据库持久化
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - BOOKS_DIR=/app/books
      - DATA_DIR=/app/data
      - FRONTEND_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novel-reader-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
