version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel-reader
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - ./books:/app/books
      - ./data:/app/data
    # 让容器内可访问宿主机上的 Ollama（baseUrl 填 http://host.docker.internal:11434）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - BOOKS_DIR=/app/books
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
