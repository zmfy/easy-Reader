version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel-reader
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - ./books:/app/books
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - BOOKS_DIR=/app/books
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
