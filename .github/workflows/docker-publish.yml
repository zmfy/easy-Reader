name: Build and Push to Docker Hub

# 镜像 tag 规则：
#   推送 main 分支   → edge、sha-xxxxxxx（开发版，尝鲜用）
#   推送 vX.Y.Z tag → X.Y.Z、X.Y、latest，并用 CHANGELOG.md 中对应一节创建 GitHub Release
#   推送 tag 或手动运行 → 用 DOCKERHUB.md 更新 Docker Hub 仓库说明
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 发版时校验：tag 版本号与 CHANGELOG.md 中的版本一致，并取出该版本的说明
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 中没有找到「## [$VERSION]」一节，请先补上更新日志再打 tag"
            exit 1
          fi

      # 3. 多平台构建：QEMU 模拟 arm64，buildx 同时产出 amd64 / arm64 镜像
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 设置镜像元数据（自动生成 tag 与 OCI 标签）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/easy-reader
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,prefix=sha-

      # 6. 构建并推送（amd64 + arm64）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用上次构建的层缓存，arm64 在 QEMU 下编译 better-sqlite3 较慢
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. 发版时把 DOCKERHUB.md 同步为 Docker Hub 的仓库说明
      #    需要 DOCKERHUB_TOKEN 具有 Read, Write, Delete 权限，否则这一步会失败（镜像已推送，不受影响）
      #    在 Actions 页面手动运行本 workflow 也会同步，改了说明不必为此发版
      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/easy-reader
          readme-filepath: ./DOCKERHUB.md
          short-description: NAS 自托管小说阅读器：TXT/EPUB/PDF/UMD，AI 补全书籍信息，听书与 AI 问书

      # 8. 创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
