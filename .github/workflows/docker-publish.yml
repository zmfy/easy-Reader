name: Build and Push to Docker Hub

# 学习版（study 分支）镜像发布到独立的 Docker Hub 仓库 easy-learner，与看书版 easy-reader 完全分开：
#   推送 study 分支        → edge、sha-xxxxxxx（开发版，尝鲜用）
#   推送 study-vX.Y.Z tag → X.Y.Z、X.Y、latest（学习版修订为 study-vX.Y.Z.N → X.Y.Z.N、X.Y、latest），
#                           并用 CHANGELOG.md 中「## [X.Y.Z-study]」一节创建 GitHub Release
#   推送 tag 或手动运行    → 用 DOCKERHUB-study.md 更新 easy-learner 的仓库说明
# git 仍是同一个仓库：发版 tag 用 study-vX.Y.Z，避免与看书版的 vX.Y.Z 冲突；
# main 的工作流只监听 'v*.*.*' tag（GitHub 的 tag 过滤从名称开头匹配），study-vX.Y.Z 不会触发看书版的发布。
# 首次推送时 Docker Hub 会自动创建 easy-learner 仓库（DOCKERHUB_TOKEN 需要 Read & Write 权限）。
on:
  push:
    branches:
      - study
    tags:
      - 'study-v*.*.*'
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 发版时校验：tag 版本号与 CHANGELOG.md 中的版本一致，并取出该版本的说明
      - name: Extract release notes
        id: version
        if: startsWith(github.ref, 'refs/tags/study-v')
        run: |
          BASE="${GITHUB_REF_NAME#study-v}"
          VERSION="${BASE}-study"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # 版本可为 X.Y.Z 或 X.Y.Z.N（N 为学习版修订号），次版本 tag 一律取前两段
          echo "minor=$(echo "$BASE" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 中没有找到「## [$VERSION]」一节，请先补上更新日志再打 tag"
            exit 1
          fi

      # 3. 多平台构建：QEMU 模拟 arm64，buildx 同时产出 amd64 / arm64 镜像
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 设置镜像元数据（自动生成 tag 与 OCI 标签）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/easy-learner
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.base }},enable=${{ startsWith(github.ref, 'refs/tags/study-v') }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ startsWith(github.ref, 'refs/tags/study-v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/study-v') }}
            type=edge,branch=study
            type=sha,prefix=sha-

      # 6. 构建并推送（amd64 + arm64）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用上次构建的层缓存，arm64 在 QEMU 下编译 better-sqlite3 较慢
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. 发版或手动运行时把 DOCKERHUB-study.md 同步为 easy-learner 的仓库说明
      #    需要 DOCKERHUB_TOKEN 具有 Read, Write, Delete 权限，否则这一步会失败（镜像已推送，不受影响）
      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/study-v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/easy-learner
          readme-filepath: ./DOCKERHUB-study.md
          short-description: 简单书房学习版：NAS 自托管小说阅读器 + 划线批注、学习导图、AI 展开知识点与笔记整理

      # 8. 创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/study-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # 学习版 Release 不标记为仓库的「Latest」，Latest 留给看书版
          make_latest: false
