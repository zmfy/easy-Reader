name: Build and Push to Docker Hub

# 学习版（study 分支）镜像发布，与 main 的看书版共用同一个 Docker Hub 仓库，靠 -study 后缀区分：
#   推送 study 分支        → edge-study、sha-xxxxxxx-study（开发版，尝鲜用）
#   推送 study-vX.Y.Z tag → X.Y.Z-study、X.Y-study、latest-study，
#                           并用 CHANGELOG.md 中「## [X.Y.Z-study]」一节创建 GitHub Release
# 不会覆盖看书版的 latest / edge / X.Y.Z 等 tag。
# main 的工作流只监听 'v*.*.*' tag；GitHub 的 tag 过滤从名称开头匹配，
# 所以 study-vX.Y.Z 不会触发 main 的发布。
# DOCKERHUB.md 仓库说明只由 main 的工作流同步，本工作流不同步，避免学习版覆盖看书版的说明。
on:
  push:
    branches:
      - study
    tags:
      - 'study-v*.*.*'
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 发版时校验：tag 版本号与 CHANGELOG.md 中的版本一致，并取出该版本的说明
      - name: Extract release notes
        id: version
        if: startsWith(github.ref, 'refs/tags/study-v')
        run: |
          BASE="${GITHUB_REF_NAME#study-v}"
          VERSION="${BASE}-study"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "minor=${BASE%.*}" >> "$GITHUB_OUTPUT"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 中没有找到「## [$VERSION]」一节，请先补上更新日志再打 tag"
            exit 1
          fi

      # 3. 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 设置镜像元数据（自动生成 tag 与 OCI 标签）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/easy-reader
          flavor: |
            latest=false
            suffix=-study
          tags: |
            type=raw,value=${{ steps.version.outputs.base }},enable=${{ startsWith(github.ref, 'refs/tags/study-v') }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ startsWith(github.ref, 'refs/tags/study-v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/study-v') }}
            type=edge,branch=study
            type=sha,prefix=sha-

      # 5. 构建并推送
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 6. 创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/study-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
